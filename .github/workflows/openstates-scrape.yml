name: OpenStates Scrape for wv

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6:00 AM UTC (1:00 AM Chicago / 2:00 AM Eastern)
  workflow_dispatch:
    inputs:
      force-update:
        type: boolean
        description: "Force push even if upstream changed (use with caution)"
        default: false
      use-self-hosted:
        type: boolean
        description: "Force self-hosted for this manual run instead of the default tinyproxy + GitHub-hosted path (e.g. to test without the proxy)"
        default: false

env:
  STATE_CODE: wv
  # workflow_dispatch's `inputs.use-proxy` default only applies to the manual-
  # dispatch UI -- it's simply unset (falsy) on a `schedule` trigger regardless
  # of that declared default, so checking `inputs.use-proxy` alone meant the
  # nightly cron always fell through to self-hosted, silently depending on a
  # laptop being on and connected for every automatic run. Proxy is now the
  # default for anything that isn't an explicit manual opt-out.
  USE_PROXY: ${{ !(github.event_name == 'workflow_dispatch' && inputs.use-self-hosted) }}

jobs:
  scrape:
    name: "🕷️ Scrape Data"
    runs-on: ${{ (github.event_name != 'workflow_dispatch' || !inputs.use-self-hosted) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 720
    permissions:
      contents: write

    steps:
      - name: Checkout state repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run scraper action
        id: scrape
        uses: chihacknight/govbot/actions/scrape@main
        with:
          state: ${{ env.STATE_CODE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-and-push: true
          force-update: ${{ inputs.force-update }}
          branch: main
          api-keys: |
            {
              "DC_API_KEY": "${{ secrets.DC_API_KEY }}",
              "NEW_YORK_API_KEY": "${{ secrets.NEW_YORK_API_KEY }}",
              "INDIANA_API_KEY": "${{ secrets.INDIANA_API_KEY }}",
              "USER_AGENT": "${{ secrets.USER_AGENT }}",
              "HTTPS_PROXY": "${{ env.USE_PROXY == 'true' && secrets.PROXY_URL || '' }}",
              "HTTP_PROXY": "${{ env.USE_PROXY == 'true' && secrets.PROXY_URL || '' }}"
            }
